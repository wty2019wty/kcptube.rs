name: rust

on:
  push:
    branches: [main, rs-dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

  # 发布矩阵里的非本地架构只做「能编译」验证：交叉编译需要 Docker/QEMU 才能跑测试，
  # 端到端用例又会绑定真实端口，跑在模拟器里既慢又不稳，因此不在这里执行。
  cross-check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            tool: cross
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            tool: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            tool: cross
          - os: windows-latest
            target: i686-pc-windows-msvc
            tool: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@cross

      - name: 交叉编译检查（Linux）
        if: matrix.tool == 'cross'
        run: cross check --workspace --all-targets --target ${{ matrix.target }}

      - name: 交叉编译检查（Windows x86）
        if: matrix.tool == 'native'
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
