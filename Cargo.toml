[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/wty2019wty/kcptube.rs"
authors = ["kcptube.rs contributors"]

[workspace.dependencies]
# ---- 内部 crate ----
kcptube-protocol = { path = "crates/protocol" }
kcptube-crypto = { path = "crates/crypto" }
kcptube-fec = { path = "crates/fec" }
kcptube-kcp = { path = "crates/kcp" }
kcptube-config = { path = "crates/config" }
kcptube-logging = { path = "crates/logging" }
kcptube-transport = { path = "crates/transport" }
kcptube-client = { path = "crates/client" }
kcptube-server = { path = "crates/server" }
kcptube-relay = { path = "crates/relay" }

# ---- 第三方 ----
# 异步运行时：对应 C++ 版的 asio + io_context + 线程池
# 只用实际需要的特性，不用 "full"（full 会额外带入 fs/process/signal/parking_lot 等）
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# 加密原语：对应 Botan3 的 AEAD_Mode
aes = "0.9"
aes-gcm = "0.11"
ocb3 = "0.2"
chacha20 = { version = "0.10", features = ["legacy"] }
chacha20poly1305 = "0.11"
poly1305 = "0.9"
sha3 = "0.12"
typenum = "1"
# 命令行与错误处理
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
anyhow = "1"
thiserror = "2"
# 日志
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "registry",
] }
# 网络与通用工具
socket2 = "0.6"
rand = "0.9"
crc32fast = "1"
# 测试辅助
hex = "0.4"

[profile.release]
# 全量 LTO：跨 crate 内联并丢弃未引用的泛型/单态化代码
lto = true
# 按体积优化（-Os）；吞吐热点在下面单独提到 -O3
opt-level = "s"
codegen-units = 1
panic = "abort"
# 去掉符号表与调试段，体积约减少 40%（发布包不需要回溯时再临时开启）
strip = "symbols"

# 加密、KCP、转发泵与校验和属于吞吐热点，保持 -O3；其余代码按体积优化。
# 实测（Windows GNU release）：全 -O3 约 1.58 MB，全 -Os 约 1.21 MB，本折中约 1.26 MB。
[profile.release.package.kcptube-crypto]
opt-level = 3
[profile.release.package.kcptube-kcp]
opt-level = 3
[profile.release.package.kcptube-transport]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.ocb3]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.sha3]
opt-level = 3
