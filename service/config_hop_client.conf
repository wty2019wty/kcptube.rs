# kcptube 客户端：部署在 192.168.10.10
# 作用：监听本地 8080，把流量经 10 个跳跃端口转发到服务端 10.10.10.10
mode=client

# 客户端业务地址；局域网内访问 0.0.0.0:8080 即可
listen_on=0.0.0.0
listen_port=8080

# 服务端地址与端口范围（需与服务端 listen_port 一致）
# 实际跳跃候选为 30000-30009，共 10 个
destination_address=10.10.10.10
destination_port=30000-30010

# 两端必须完全一致
encryption_algorithm=AES-GCM
encryption_password=change-me-please-1234

# KCP 参数预设
kcp=regular3

# 每 60 秒尝试切换一次发送端口
dport_refresh=60
