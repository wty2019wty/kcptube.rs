# kcptube 服务端：部署在 10.10.10.10
# 作用：监听端口范围，接收客户端流量后转发到本机 127.0.0.1:80
mode=server

# 只监听服务端的业务地址
listen_on=10.10.10.10

# 服务端监听 30000-30010（11 个端口，端口范围含两端）
# 客户端跳跃候选同样是 30000-30010（11 个），与 C++ 行为一致
listen_port=30000-30010

# 服务端最终要访问的本机 HTTP 服务
destination_address=127.0.0.1
destination_port=80

# 两端必须完全一致
encryption_algorithm=AES-GCM
encryption_password=change-me-please-1234

# KCP 参数预设
kcp=regular3
